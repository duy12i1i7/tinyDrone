name: Test original huge-app plus PSRAM option
on:
  push:
    branches:
      - audit/firmware-provenance-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-huge-app-psram-audit:
    runs-on: windows-2022
    env:
      PYTHONIOENCODING: utf-8
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact source and bundled firmware
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Restore SHA-256 verified Espressif archives cache
        id: cached
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/Arduino15/staging/packages
          key: windows-esp32-3.3.1-official-archives-v2-${{ github.run_id }}
          restore-keys: |
            windows-esp32-3.3.1-official-archives-v2-

      - name: Download official board index
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          if ($LASTEXITCODE -ne 0) { throw "Failed to download official Espressif index" }

      - name: Probe HTTP redirects and pre-download vendor archives with SHA-256 verification
        id: prime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/prime_windows_arduino_cache.py
          if ($LASTEXITCODE -ne 0) { throw "Unable to retrieve verified vendor archives" }

      - name: Save verified vendor archive cache
        if: steps.prime.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/Arduino15/staging/packages
          key: windows-esp32-3.3.1-official-archives-v2-${{ github.run_id }}

      - name: Install Espressif ESP32 core 3.3.1 from verified staged packages
        run: |
          arduino-cli core install esp32:esp32@3.3.1 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          if ($LASTEXITCODE -ne 0) { throw "Failed to install ESP32 core 3.3.1 from verified archives" }
          arduino-cli core list

      - name: Install exact libraries used in Linux comparison
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "FlixPeriph@1.10.3" "MAVLink@2.0.33"
          arduino-cli lib list

      - name: Build unchanged source with huge_app and PSRAM enabled
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app,PSRAM=enabled --output-dir "$env:GITHUB_WORKSPACE/build" --warnings default src/XW-Drone
          if ($LASTEXITCODE -ne 0) { throw "Arduino build failed" }
          Get-ChildItem build -Filter *.bin | Select-Object Name,Length | Format-Table

      - name: Assert partition table matches original huge-app layout
        run: |
          @'
          from pathlib import Path
          import hashlib
          r = Path("Firmware/XW-Drone.ino.merged.bin").read_bytes()
          b = Path("build/XW-Drone.ino.merged.bin").read_bytes()
          p1, p2 = r[0x8000:0x9000], b[0x8000:0x9000]
          print("ORIGINAL_PARTITION_SHA256=" + hashlib.sha256(p1).hexdigest())
          print("HUGE_APP_PARTITION_SHA256=" + hashlib.sha256(p2).hexdigest())
          print("PARTITION_TABLE_MATCH=" + str(p1 == p2))
          if p1 != p2:
              raise SystemExit("Huge-app partition table still differs; do not flash")
          '@ | python -

      - name: Compare original firmware and Windows build
        run: |
          @'
          from pathlib import Path
          import hashlib
          r = Path("Firmware/XW-Drone.ino.merged.bin").read_bytes()
          print("REFERENCE_SHA256=" + hashlib.sha256(r).hexdigest())
          print("REFERENCE_SIZE=" + str(len(r)))
          for path in sorted(Path("build").glob("*.bin")):
              b = path.read_bytes()
              print("WINDOWS_BUILD_BIN=" + path.name)
              print("WINDOWS_BUILD_SHA256=" + hashlib.sha256(b).hexdigest())
              print("WINDOWS_BUILD_SIZE=" + str(len(b)))
              if "merged" in path.name:
                  print("FULL_BINARY_MATCH=" + str(b == r))
          app = Path("build/XW-Drone.ino.bin").read_bytes()
          reference_app_slice = r[0x10000:0x10000+len(app)]
          print("APP_OFFSET_0x10000_EXACT_MATCH=" + str(app == reference_app_slice))
          if app != reference_app_slice:
              diff = next((i for i,(x,y) in enumerate(zip(app,reference_app_slice)) if x!=y),None)
              print("APP_FIRST_DIFFERING_BYTE=" + str(diff))
          '@ | python -

      - name: Compare ESP image metadata and feature fingerprints
        run: python .github/scripts/firmware_static_audit.py

      - name: Compare retained source literals and code/data fingerprints
        run: python .github/scripts/firmware_source_strings_audit.py

      - name: Preserve reproducibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-esp32-3.3.1-huge-app-psram-build
          path: |
            build/*.bin
          if-no-files-found: warn
          retention-days: 7
